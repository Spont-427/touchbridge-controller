name: Release downloads

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-desktop-downloads:
    runs-on: ubuntu-latest
    steps:
      - name: Check out released source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Package Windows and Linux downloads
        run: ./scripts/package-release.sh

      - name: Attach desktop downloads to this release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/TouchBridge-Windows-x64.zip \
            dist/TouchBridge-Linux-x86_64.tar.gz \
            dist/TouchBridge-Linux-ARM64.tar.gz \
            --clobber
