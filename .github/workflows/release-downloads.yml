name: Release downloads

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out released source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Package Windows and Linux downloads
        run: ./scripts/package-release.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35 and Build Tools 36
        run: sdkmanager "platforms;android-35" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Build tester APK
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "v$(cat VERSION)" = "$RELEASE_TAG"
          gradle -p android-client assembleDebug --no-daemon
          mkdir -p dist
          cp android-client/app/build/outputs/apk/debug/app-debug.apk "dist/TouchBridge-$(cat VERSION)-debug.apk"

      - name: Attach desktop packages and Android debug APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/TouchBridge-Windows-x64.zip \
            dist/TouchBridge-Linux-x86_64.tar.gz \
            dist/TouchBridge-Linux-ARM64.tar.gz \
            "dist/TouchBridge-$(cat VERSION)-debug.apk" \
            --clobber
